# AKERATEN v.0.1 - backend + redis + postgres
# Usage: cp .env.example .env  (fill keys or leave empty for DEMO mode) && docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://akeraten:akeraten@postgres:5432/akeraten
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: akeraten
      POSTGRES_PASSWORD: akeraten
      POSTGRES_DB: akeraten
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akeraten"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
