name: Backend (tests + real-data training)

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly retrain on fresh Sackmann data

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt xgboost
      - name: Unit tests
        run: python -m pytest -q
      - name: Train models on real ATP/WTA data (JeffSackmann)
        run: python scripts/train_models.py
      - name: Show held-out metrics
        run: cat data/model_metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: akeraten-models
          path: |
            backend/data/tennis_ratings.json
            backend/data/tennis_ml.joblib
            backend/data/model_metrics.json
