name: Android APK (AKERATEN v.0.1)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default installs the removed legacy 'tools' package and fails.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Use the committed wrapper when present; otherwise provision Gradle 8.9.
          gradle-version: ${{ hashFiles('android/gradle/wrapper/gradle-wrapper.jar') != '' && 'wrapper' || '8.9' }}

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/akeraten-release.jks"
            echo "AKERATEN_KEYSTORE_PATH=${RUNNER_TEMP}/akeraten-release.jks" >> "${GITHUB_ENV}"
            echo "Release keystore decoded."
          else
            echo "::notice::KEYSTORE_BASE64 not set - the release APK will be signed with the debug key."
          fi

      - name: Build APKs
        env:
          AKERATEN_KEYSTORE_PASSWORD: ${{ secrets.AKERATEN_KEYSTORE_PASSWORD }}
          AKERATEN_KEY_ALIAS: ${{ secrets.AKERATEN_KEY_ALIAS }}
          AKERATEN_KEY_PASSWORD: ${{ secrets.AKERATEN_KEY_PASSWORD }}
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          ${GRADLE_CMD} --no-daemon --stacktrace assembleDebug assembleRelease

      - name: List outputs
        run: find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: akeraten-v0.1-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: akeraten-v0.1-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
